version: '3.8'

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: masikus
      POSTGRES_DB: it-mars
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@mars.com
      PGADMIN_DEFAULT_PASSWORD: masikus
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    ports:
      - "5006:5006"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    depends_on:
      - postgres
      - mongo
    restart: unless-stopped

  # 1. Host
  frontend-host:
    build:
      context: .
      dockerfile: ./docker/host/Dockerfile
      args:
        - SERVICE_NAME=host
    ports:
      - "3000:3000" # Исправлено на 3000, как ты и сказал
    restart: unless-stopped

  # 2. Admin (по вебпаку: 3001)
  frontend-admin:
    build:
      context: .
      dockerfile: ./docker/host/Dockerfile
      args:
        - SERVICE_NAME=Admin
    ports:
      - "3001:3000"
    restart: unless-stopped

  # 3. MyProfile (по вебпаку: 3002)
